name: Deploy to GitHub Pages

# Publishes the existing static production site (index.html, css/, js/,
# icons/, manifest.webmanifest, sw.js) UNCHANGED at the domain root, plus the
# cloth-lab/ Vite app built and published at a /cloth-lab/ subpath alongside
# it — one combined artifact, not a replacement of the production site. See
# cloth-lab/vite.config.js's `base` for the matching subpath.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Gates build/deploy — see BerryStudio-Upgrade-Plan WP-0.2. Root app tests
  # (node --test, no build step needed — the app is loaded directly as ES
  # modules), cloth-lab's vitest unit tests, and one light Playwright smoke
  # spec covering load → grade → export SVG → open 3D preview.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloth-lab/package-lock.json

      - name: Install root dev dependencies
        run: npm ci

      - name: Root unit tests (node --test)
        run: npm test

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke test
        run: npm run test:e2e

      - name: Install cloth-lab dependencies
        run: npm ci
        working-directory: cloth-lab

      - name: cloth-lab unit tests (vitest)
        run: npm test
        working-directory: cloth-lab

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cloth-lab/package-lock.json

      - name: Install cloth-lab dependencies
        run: npm ci
        working-directory: cloth-lab

      - name: Build cloth-lab
        run: npm run build
        working-directory: cloth-lab

      - name: Assemble combined site
        run: |
          set -e
          mkdir -p _site
          cp -r index.html css icons js manifest.webmanifest sw.js _site/
          mkdir -p _site/cloth-lab
          cp -r cloth-lab/dist/. _site/cloth-lab/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
