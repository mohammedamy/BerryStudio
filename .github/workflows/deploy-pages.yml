name: Deploy to GitHub Pages

# Publishes the existing static production site (index.html, css/, js/,
# icons/, env/, schema/, manifest.webmanifest, sw.js, docs/, avatars/, plus
# any other top-level HTML entry point — body.html, 3d-test.html,
# privacy.html) UNCHANGED
# at the domain root, plus the cloth-lab/ Vite app built and published at a
# /cloth-lab/ subpath alongside it — one combined artifact, not a
# replacement of the production site. See cloth-lab/vite.config.js's `base`
# for the matching subpath. Also builds and publishes cloth-lab's
# embedded-library bundle (dist-embed/, WP-5) at /cloth-lab/dist-embed/ —
# js/app.js's mountClothLabEmbedded() resolves it relative to its own
# module URL, so it must land at exactly that path for the "embedded"
# engine flag to work in production.
#
# POST-MORTEM (found while verifying WP-16's new docs/ deployed correctly):
# the "Assemble combined site" step below used an EXPLICIT file/directory
# allow-list (`cp -r index.html css icons js env schema manifest.webmanifest
# sw.js`) written once and never updated as new top-level entry points were
# added in later phases — body.html (WP-10) and 3d-test.html (WP-9) had
# been silently 404ing in production since the phase that introduced each
# of them, despite both being genuinely built, tested, and linked from the
# live app. Fixed by adding them (and docs/) to the copy list explicitly;
# a genuinely new top-level HTML file added in a future phase will need
# the same one-line addition here — this is a deliberate allow-list, not
# an oversight to "fix properly" with a wildcard, since a wildcard here
# would also start publishing scratch/dev files that don't belong in
# production (this repo's root is not a build output directory).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Gates build/deploy — see BerryStudio-Upgrade-Plan WP-0.2. Root app tests
  # (node --test, no build step needed — the app is loaded directly as ES
  # modules), cloth-lab's vitest unit tests, and one light Playwright smoke
  # spec covering load → grade → export SVG → open 3D preview.
  #
  # POST-MORTEM (found while investigating why the live site hadn't updated
  # since before Phase 0, despite every phase since being pushed and
  # reported complete): every run of this workflow since WP-0.2 introduced
  # it had been silently FAILING at the "Root unit tests" step — root
  # package.json's test script was `node --test "test/*.test.js"` (a
  # quoted glob string). Node 20 (pinned here at the time) does not expand
  # `*` in an explicit file-path argument to `--test` — it looks for a
  # literal file named `test/*.test.js`, finds none, and exits 1, which
  # this job never surfaced past because `npm test` was always run and
  # verified locally against a newer Node that DOES glob-expand test
  # runner arguments (confirmed empirically: fails on Node 20.20.2, passes
  # on Node 24.18.0). Fixed at the source — package.json's script is now
  # `node --test test/*.test.js` (unquoted), so the SHELL expands the glob
  # into literal filenames before Node ever sees it, which is correct and
  # identical on every Node version tested. node-version bumped 20→22 in
  # this file at the same time: `cloth-lab`'s own toolchain (vite@8,
  # vitest@4) already declares `engines.node: >=22.0.0`; npm only warns
  # (EBADENGINE) rather than failing on the mismatch, which is why builds
  # kept succeeding once they got this far, but it was a real, unforced
  # gap between what CI ran and what the toolchain actually asked for —
  # closing it rather than leaving a passing-by-luck warning in place.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloth-lab/package-lock.json

      - name: Install root dev dependencies
        run: npm ci

      - name: Root unit tests (node --test)
        run: npm test

      # WP-66/68 (BerryStudio-Upgrade-Plan-v5.md): every "zero new oxlint
      # warnings" claim across this project's history (see CHANGELOG.md) had
      # been manual, hand-run diligence with no automated backstop — a
      # regression could ship silently if a session skipped the habit.
      # `oxlint`'s own default behaviour only fails the process on
      # error-severity findings, not warnings — this repo currently carries
      # 101 pre-existing warnings (confirmed 26 August 2026; none are
      # errors), so this step passes today without requiring that backlog
      # cleaned up first, and only ever fails CI on something genuinely new
      # and more serious than the accepted baseline. Tightening this to also
      # fail on warnings (oxlint's own `--deny-warnings`, or a warning-count
      # ratchet) is a real, separate follow-up once that backlog is
      # addressed — not done here, and deliberately not silently assumed.
      - name: Lint (root app)
        run: npm run lint

      - name: Install cloth-lab dependencies
        run: npm ci
        working-directory: cloth-lab

      - name: cloth-lab unit tests (vitest)
        run: npm test
        working-directory: cloth-lab

      - name: Lint (cloth-lab)
        run: npm run lint
        working-directory: cloth-lab

      # The Playwright smoke suite serves the repo root directly (no build
      # step for the root app itself), but 2 of its 5 tests exercise the
      # embedded Cloth Lab engine (WP-5) and the standalone BodyForm page
      # (WP-10), both of which dynamically import cloth-lab/dist-embed/
      # cloth-lab-embed.js at a real, physical path — a build OUTPUT this
      # job never produced before this fix. The separate `build` job below
      # does build it, but that's a different runner with no shared
      # filesystem, and only runs (needs: test) AFTER this job already
      # passed — it can never retroactively fix what this job just tested
      # against. Confirmed via CI annotations (not guessed): both failing
      # tests' captured console errors were literally "Failed to fetch
      # dynamically imported module: .../cloth-lab-embed.js" — a plain
      # 404, not a WebGL/GPU/headless-rendering limitation as first
      # suspected before the `github` reporter surfaced the real error.
      - name: Build cloth-lab (embedded library, needed by the Playwright smoke test)
        run: npm run build:embed
        working-directory: cloth-lab

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke test
        run: npm run test:e2e

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloth-lab/package-lock.json

      - name: Install cloth-lab dependencies
        run: npm ci
        working-directory: cloth-lab

      - name: Build cloth-lab (standalone)
        run: npm run build
        working-directory: cloth-lab

      - name: Build cloth-lab (embedded library, WP-5)
        run: npm run build:embed
        working-directory: cloth-lab

      - name: Assemble combined site
        run: |
          set -e
          mkdir -p _site
          cp -r index.html body.html 3d-test.html privacy.html css icons js env schema manifest.webmanifest sw.js docs avatars _site/
          mkdir -p _site/cloth-lab
          cp -r cloth-lab/dist/. _site/cloth-lab/
          mkdir -p _site/cloth-lab/dist-embed
          cp -r cloth-lab/dist-embed/. _site/cloth-lab/dist-embed/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
