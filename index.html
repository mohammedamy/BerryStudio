<!--
  Content-Security-Policy (BerryStudio-Upgrade-Plan WP-1, security requirement #4).
  connect-src is deliberately broadened to `https:` + `http(s)://localhost:*`
  rather than a short named allow-list: the openai-compatible/llamacpp/vllm
  provider adapters let the user type an arbitrary base URL at runtime, and a
  <meta> CSP is fixed at parse time — it cannot be expanded later as providers
  are configured. Restricting connect-src to a fixed short list would silently
  break those adapters for any origin not already on it, which the project's
  "do not fake capability" rule forbids. This is a real, documented trade-off
  (see README's Honest notes for WP-1), not an oversight.
  script-src allows the CDN origins existing/planned dynamic imports use:
  unpkg.com (three.js, via the import map below) and esm.sh (the on-demand
  transformers.js/onnxruntime-web loader inside js/workers/local-model-worker.js,
  WP-2; and, as of WP-5, react/react-dom/@react-three/fiber/@react-three/drei
  below, lazy-loaded only when Fit Studio's embedded engine opens); and, as
  of WP-18, accounts.google.com (Google Identity Services, for the optional
  Google Drive sync target) and alcdn.msauth.net (Microsoft's official
  MSAL.js CDN, for the optional OneDrive sync target) — both load only if
  the user explicitly opts into that specific cloud-sync target in Settings,
  never on a normal page load.
  BerryStudio-Upgrade-Plan-v3.2 WP-42 Stage A adds js/auth.js's Supabase
  Auth client, loaded from esm.sh (already allow-listed above) via the
  import map below — no new script-src origin needed. Google/Facebook
  sign-in themselves are a top-level browser *navigation* to Supabase's
  hosted /auth/v1/authorize endpoint and back (accounts.google.com/
  facebook.com are never fetched or scripted from this page directly),
  so no connect-src/script-src entry for either provider is needed either;
  the Supabase REST/auth calls the SDK itself makes are already covered by
  connect-src's existing broad `https:` allowance.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com https://esm.sh https://accounts.google.com https://alcdn.msauth.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https: http://localhost:* https://localhost:*; worker-src 'self' blob:; manifest-src 'self'; base-uri 'self'; form-action 'self';">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.185.1/examples/jsm/",
    "react": "https://esm.sh/react@19.2.7",
    "react/jsx-runtime": "https://esm.sh/react@19.2.7/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@19.2.7?external=react",
    "react-dom/client": "https://esm.sh/react-dom@19.2.7/client?external=react",
    "@react-three/fiber": "https://esm.sh/@react-three/fiber@9.6.1?external=react,react-dom,three",
    "@react-three/drei": "https://esm.sh/@react-three/drei@10.7.7?external=react,react-dom,three,@react-three/fiber",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.112.3"
  }
}
</script>
<!--
  WP-5: `three` bumped 0.160.0 -> 0.185.1 to match cloth-lab's own pinned
  version (package.json: "three": "^0.185.1") — the whole point of routing
  both apps' three.js through this one import map is that they load the
  EXACT SAME module instance (two separate Three.js copies in one page is a
  real bug class: instanceof checks across the two fail silently). Checked
  directly against the pinned 0.160.0 source before this bump (see
  three-view.js's own WP-9.2/9.3 comments) that every API this app's
  three-view.js uses (ACESFilmicToneMapping, SRGBColorSpace, transmission,
  anisotropy, RGBELoader, PCFSoftShadowMap, OrbitControls, GLTFLoader) is
  present in both versions — confirmed again after the bump via the
  existing Playwright smoke spec, not just assumed stable across 25 releases.
  react/react-dom/@react-three/fiber/@react-three/drei: React 19 has no
  ready-to-serve browser ESM build on a plain file host like unpkg (its
  package exports are structured for a bundler) — esm.sh transpiles/bundles
  on the fly AND supports `?external=` to make a downstream package (fiber,
  drei) import react/react-dom/three as bare specifiers instead of pulling
  in its own copies, which is what lets this import map be the single
  source of truth for those three shared libraries. Confirmed by fetching
  fiber's actual served module and checking its own import statements
  reference bare `"react"`/`"three"` (resolved by this map), not a
  esm.sh-hosted react/three of its own.
-->
</head>
<body data-theme="intl" data-mode="light" data-contrast="normal">

<div id="app">

  <!-- ===== TOP BAR ===== -->
  <header class="topbar">
    <div class="brand">
      <span class="logo" id="logo"><img src="icons/icon-192.png" alt="BerryStudio" width="34" height="34"></span>
      <span><span class="brand-name" id="brandName">BerryStudio</span><br><span class="brand-sub" id="brandSub">Fashion Pattern Design</span></span>
    </div>

    <button class="icon-btn" id="projectBtn" style="margin-inline-start:10px" title="Project" data-i18n-aria="project" aria-label="Project"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>

    <div class="seg hide-sm" id="catSeg" role="group" aria-label="Category">
      <button data-cat="women" class="active" data-i18n="women" aria-pressed="true">Women</button>
      <button data-cat="men" data-i18n="men" aria-pressed="false">Men</button>
      <button data-cat="girls" data-i18n="girls" aria-pressed="false">Girls</button>
      <button data-cat="boys" data-i18n="boys" aria-pressed="false">Boys</button>
    </div>

    <div class="spacer"></div>

    <div class="seg" id="viewToggle" role="group" aria-label="View">
      <button data-v="2d" class="active" aria-pressed="true">2D Pattern</button>
      <button data-v="3d" aria-pressed="false">3D Preview</button>
      <button data-v="clothlab" aria-pressed="false">3D Cloth Lab</button>
    </div>

    <button class="pill" id="unitsPill"><span class="u">cm</span></button>
    <button class="icon-btn" id="cmdBtn" data-i18n-aria="cmd" aria-label="⌘K">⌘</button>
    <button class="icon-btn" id="themeBtn" data-i18n-aria="theme" aria-label="Theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3a9 9 0 1 0 0 18c1 0 1.5-1 1-2s0-2 1-2h2a4 4 0 0 0 4-4c0-5-4-8-8-8z"/><circle cx="7.5" cy="11.5" r="1"/><circle cx="12" cy="8" r="1"/><circle cx="16" cy="11" r="1"/></svg></button>
    <button class="icon-btn" id="langBtn" style="font-weight:800;font-size:12px" data-i18n-aria="language" aria-label="Language">ع / EN</button>
    <button class="icon-btn" id="modeBtn" data-i18n-aria="appearance" aria-label="Appearance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg></button>
    <a class="icon-btn" id="docsBtn" href="docs/index.html" target="_blank" rel="noopener" data-i18n-aria="docs" aria-label="Docs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H12v18H6.5A2.5 2.5 0 0 1 4 18.5v-13z"/><path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H12v18h5.5a2.5 2.5 0 0 0 2.5-2.5v-13z"/></svg></a>
    <button class="icon-btn" id="helpBtn" data-i18n-aria="help" aria-label="Help"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.2 9a2.8 2.8 0 1 1 4.3 2.4c-.9.6-1.5 1.1-1.5 2.1"/><circle cx="12" cy="17" r="0.6" fill="currentColor"/></svg></button>
    <button class="icon-btn" id="settingsBtn" data-i18n-aria="settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.3 1a7 7 0 0 0-1.7-1l-.3-2.6h-4l-.3 2.6a7 7 0 0 0-1.7 1l-2.3-1-2 3.4 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 1.7 1l.3 2.6h4l.3-2.6a7 7 0 0 0 1.7-1l2.3 1 2-3.4-2-1.5c.1-.3.1-.6.1-1z"/></svg></button>
    <!-- BerryStudio-Upgrade-Plan-v3.2 WP-42 Stage A: account sign-in, optional,
         no gating — see js/auth.js. Shows a person icon signed out, or the
         first letter of the signed-in email (set by js/app.js's onAuthChange). -->
    <button class="icon-btn" id="accountBtn" data-i18n-aria="account" aria-label="Account"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 1 0-16 0"/><circle cx="12" cy="8" r="4.5"/></svg></button>
    <button class="icon-btn hidden" id="installBtn" data-i18n-aria="installApp" aria-label="Install App"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg></button>
  </header>

  <!-- ===== PROJECT TABS ===== multiple independent pattern projects open
       at once, switched like browser tabs — see js/app.js's
       renderProjectTabs()/switchToProject(). Click a tab to switch, "×" to
       close, "+" to open a new blank one, double-click a label to rename. -->
  <div class="project-tabs" id="projectTabs"></div>

  <!-- ===== WORKSPACE ===== -->
  <div class="workspace">

    <!-- tool rail -->
    <aside class="left-rail toolrail" id="toolrail"></aside>

    <!-- center stage -->
    <main class="stage">
      <div class="stage-toolbar">
        <button class="chip" id="undoBtn" title="Undo" style="cursor:pointer"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M3 13a9 9 0 1 0 3-7.7L3 8"/></svg></button>
        <button class="chip" id="redoBtn" title="Redo" style="cursor:pointer"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M21 13a9 9 0 1 1-3-7.7L21 8"/></svg></button>
        <div style="width:1px;height:20px;background:var(--line)"></div>
        <button class="chip" id="gridBtn" title="Grid" style="cursor:pointer"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg></button>
        <button class="chip" id="snapBtn" title="Snap" style="cursor:pointer"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 3v8a6 6 0 0 0 12 0V3"/><path d="M6 3h4v4H6zM14 3h4v4h-4z"/></svg></button>
        <button class="chip" id="bgBtn" title="Background image" style="cursor:pointer"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 16l-5-5L5 20"/></svg></button>
        <button class="chip" id="objBrowserBtn" title="Object browser" style="cursor:pointer"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4"/><rect x="3" y="10" width="18" height="4"/><rect x="3" y="16" width="18" height="4"/></svg></button>
        <button class="chip" id="snapshotBtn" title="Snapshot" style="cursor:pointer"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l2.8 2.8M16.2 16.2 19 19M19 5l-2.8 2.8M7.8 16.2 5 19"/><circle cx="12" cy="12" r="4"/></svg></button>
        <button class="chip" id="splitViewBtn" title="Split View: 2D + 3D" aria-pressed="false" style="cursor:pointer"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg></button>
        <div style="width:1px;height:20px;background:var(--line)"></div>
        <span class="chip" id="chipSize"></span>
        <span class="chip" id="chipStd"></span>
        <span class="chip" id="chipChest"></span>
      </div>

      <div class="canvas-wrap">
        <canvas id="patternCanvas" tabindex="0" role="application" data-i18n-aria="canvasAriaLabel" aria-label="Pattern canvas"></canvas>

        <!-- 3D layer -->
        <div class="view3d-wrap" id="view3d">
          <canvas id="canvas3d" tabindex="0" role="img" data-i18n-aria="canvas3dAriaLabel" aria-label="3D preview"></canvas>
          <div class="v3d-loading" id="v3dLoading"><span class="v3d-spinner"></span><span id="v3dLoadingTxt">Loading avatar…</span></div>
          <div class="v3d-error" id="v3dError">
            <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
            <p data-i18n="v3dErrorTitle">3D preview unavailable</p>
            <span class="v3d-error-body" data-i18n="v3dErrorBody">We couldn't start the 3D preview — check your connection and try again.</span>
            <div class="v3d-error-actions">
              <button class="big-btn" id="v3dRetryBtn" data-i18n="v3dRetry">Retry</button>
              <button class="big-btn ghost" id="v3dContinue2DBtn" data-i18n="v3dContinue2D">Continue in 2D</button>
            </div>
          </div>
          <div style="position:absolute;inset-inline-start:16px;top:16px;display:flex;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow-2)">
            <label style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700"><input type="checkbox" id="spinToggle" checked> 360°</label>
            <label style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700"><input type="checkbox" id="walkToggle" checked> Walk</label>
          </div>
        </div>

        <!-- Cloth Lab layer: a separate React/R3F app (cloth-lab/). Two
             mount strategies, gated by state.clothLabEngine (WP-5.5):
             "iframe" (default) — the original approach, own build/deploy,
             src set lazily on first switch (loadClothLab in app.js).
             "embedded" — cloth-lab's lib build (cloth-lab/dist-embed/,
             WP-5.4) mounted directly into #clothLabEmbed via its own
             mount()/update() API, sharing this page's React/three.js
             instances through the import map above instead of loading a
             second framework copy inside an iframe. Only one of the two
             is ever populated at a time; the other stays empty. -->
        <div class="clothlab-wrap" id="viewClothLab">
          <iframe id="clothLabFrame" title="3D Cloth Lab"></iframe>
          <div id="clothLabEmbed" style="width:100%;height:100%"></div>
        </div>

        <!-- empty state -->
        <div id="emptyState" class="hidden" style="position:absolute;inset:0;display:grid;place-items:center;text-align:center;z-index:4">
          <div style="max-width:340px">
            <div style="width:88px;height:88px;margin:0 auto 18px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:var(--brand-ink)"><svg viewBox="0 0 24 24" width="42" height="42" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M9 2l3 3 3-3 2 5-3 3 4 12H6l4-12-3-3z"/></svg></div>
            <p style="color:var(--ink-2);font-size:14px;line-height:1.6;margin-bottom:18px" data-i18n="empty2d">Pick a pattern to begin.</p>
            <button class="big-btn" id="emptyDraft" data-i18n="startDraft" style="margin-bottom:8px">Start Drafting</button>
            <button class="big-btn ghost" id="emptyLib" data-i18n="openLibrary">Open Library</button>
          </div>
        </div>

        <!-- piece info popover -->
        <div class="piece-info" id="pieceInfo" style="inset-inline-start:24px;bottom:70px"></div>

        <!-- zoom -->
        <div class="zoombar">
          <button id="zout">−</button>
          <span class="zval" id="zval">100%</span>
          <button id="zin">+</button>
          <button id="zfit"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6"/></svg></button>
        </div>
      </div>
    </main>

    <!-- right rail -->
    <aside class="right-rail" id="rightRail">
      <div class="rail-tabs" id="railTabs"></div>
      <div class="rail-body">
        <div class="rail-pane active" data-pane="size"></div>
        <div class="rail-pane" data-pane="measure"></div>
        <div class="rail-pane" data-pane="layers"></div>
        <div class="rail-pane" data-pane="library"></div>
        <div class="rail-pane" data-pane="ai"></div>
        <div class="rail-pane" data-pane="builder"></div>
        <div class="rail-pane" data-pane="export"></div>
      </div>
    </aside>

  </div>
</div>

<!-- ===== MODALS ===== -->

  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="themeModalTitle" tabindex="-1">
    <div class="modal-head"><div><h2 id="themeModalTitle" data-i18n="theme">Theme</h2><p data-i18n="tt_theme">Choose a look</p></div></div>

    <div class="modal-foot"><button class="big-btn" data-close="#themeModal" data-i18n="close" style="width:auto;padding:10px 22px">Close</button></div>

  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsModalTitle" tabindex="-1">
    <div class="modal-head"><div><h2 id="settingsModalTitle" data-i18n="settings">Settings</h2></div></div>
    <div class="modal-body"></div>
    <div class="modal-foot"><button class="big-btn" data-close="#settingsModal" data-i18n="close" style="width:auto;padding:10px 22px">Close</button></div>

<!-- WP-42 Stage A: auth.js's own bare-specifier dynamic import() of
     '@supabase/supabase-js' only resolves through the import map above when
     auth.js has its own top-level module script tag here, matching every
     other js/*.js file's convention — reaching it only via app.js's nested

     resolve the bare specifier (verified live: this exact failure mode,
     "Failed to resolve module specifier", reproduced identically for a
     definitely-working bare specifier like "three" once tested from a
     module not on this list — not a bug in the import map itself). -->
