<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="intl" data-mode="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6d5efc">
<title>BerryStudio — BodyForm</title>
<meta name="description" content="Build a 3D avatar from your body measurements, then send it to BerryStudio's Fit Studio.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-512.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<!--
  Same CSP as index.html (BerryStudio-Upgrade-Plan WP-1/WP-5) — this page
  also dynamically imports cloth-lab's embedded engine, which needs the
  same react/react-dom/@react-three/fiber/@react-three/drei/three CDN
  origins allowed in script-src. See index.html's own comment for the full
  rationale on each directive.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https: http://localhost:* https://localhost:*; worker-src 'self' blob:; manifest-src 'self'; base-uri 'self'; form-action 'self';">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.185.1/examples/jsm/",
    "react": "https://esm.sh/react@19.2.7",
    "react/jsx-runtime": "https://esm.sh/react@19.2.7/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@19.2.7?external=react",
    "react-dom/client": "https://esm.sh/react-dom@19.2.7/client?external=react",
    "@react-three/fiber": "https://esm.sh/@react-three/fiber@9.6.1?external=react,react-dom,three",
    "@react-three/drei": "https://esm.sh/@react-three/drei@10.7.7?external=react,react-dom,three,@react-three/fiber"
  }
}
</script>
<style>
  /* BodyForm's own simple two-pane layout — deliberately not reusing
     index.html's #app/.workspace grid (that one's built around a drafting
     canvas + tool rail + multi-tab right rail, none of which exist here).
     Everything else (buttons, fields, size grid, measurement rows) reuses
     css/styles.css's existing classes for visual consistency. */
  #bfApp { display: flex; flex-direction: column; height: 100vh; }
  .bf-header { display: flex; align-items: center; gap: 14px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); flex: 0 0 auto; }
  .bf-back { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 12px; background: var(--panel-2); color: var(--ink); text-decoration: none; flex: 0 0 auto; }
  .bf-body { flex: 1 1 auto; display: flex; min-height: 0; }
  .bf-sidebar { width: 320px; flex: 0 0 auto; border-inline-end: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 16px; }
  .bf-main { flex: 1 1 auto; position: relative; background: var(--bg-2); }
  #clothLabEmbed { width: 100%; height: 100%; }
</style>
</head>
<body data-theme="intl" data-mode="light">

<div id="bfApp">
  <header class="bf-header">
    <a class="bf-back" href="index.html" title="Back" data-i18n-title="backToStudio">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <span style="display:inline-flex"><img src="icons/icon-192.png" alt="" width="34" height="34" style="border-radius:10px"></span>
    <span>
      <span style="font-weight:800;font-size:15px" data-i18n="bodyFormTitle">BodyForm</span><br>
      <span style="font-size:11px;color:var(--ink-2)" data-i18n="bodyFormTagline">Build a 3D avatar from your measurements</span>
    </span>
    <div style="flex:1"></div>
    <div class="seg" id="catSeg">
      <button data-cat="women" class="active" data-i18n="women">Women</button>
      <button data-cat="men" data-i18n="men">Men</button>
      <button data-cat="girls" data-i18n="girls">Girls</button>
      <button data-cat="boys" data-i18n="boys">Boys</button>
    </div>
  </header>

  <div class="bf-body">
    <aside class="bf-sidebar">
      <div class="help-note" data-i18n="bodyFormIntro">Pick a category and starting size, fine-tune any measurement, then generate your avatar.</div>

      <div class="section-title" style="margin-top:14px" data-i18n="sizeGrading">Size & Grading</div>
      <div class="field"><label data-i18n="standard">Measurement Standard</label>
        <select class="select" id="standardSel"></select>
      </div>
      <div class="size-grid" id="sizeGrid"></div>

      <div class="section-title" style="margin-top:14px" data-i18n="kidsMode">Kids age groups</div>
      <div class="size-grid" id="kidsGrid"></div>

      <div class="section-title" style="margin-top:18px" data-i18n="customMeas">Custom Measurements</div>
      <div id="measureFields"></div>

      <button class="big-btn" id="generateBtn" style="margin-top:16px" data-i18n="generateAvatar">Generate Avatar</button>
      <button class="big-btn ghost" id="openFitBtn" style="margin-top:8px" data-i18n="openInFitStudio">Open in Fit Studio</button>
      <div class="help-note" style="margin-top:8px" data-i18n="openInFitStudioD">Carries this category and these measurements over to the main app's 3D Cloth Lab.</div>
    </aside>
    <main class="bf-main">
      <div id="clothLabEmbed"></div>
    </main>
  </div>
</div>

<script type="module" src="js/body-page.js"></script>
</body>
</html>
